{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-[#050913] text-white flex items-center justify-center p-6">
  <div class="w-full max-w-md p-8 rounded-3xl bg-[#0a111e] border border-slate-800 space-y-6 shadow-2xl">
    
    <div class="text-center space-y-1">
      <h2 class="text-xl font-bold">Reset Your Password</h2>
      <p class="text-xs text-slate-400">Enter your registered details to set a new password.</p>
    </div>

    <!-- Django Messages Alert -->
    {% if messages %}
      <div class="space-y-2">
        {% for message in messages %}
          <div class="p-3 rounded-xl border text-xs font-semibold flex items-center justify-between
                      {% if message.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-400
                      {% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-400{% endif %}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Username or Email</label>
        <input type="text" name="username_or_email" required placeholder="username"
               class="w-full text-xs rounded-xl px-4 py-2.5 bg-slate-900 border border-slate-800 text-slate-100 focus:outline-none focus:border-cyan-400">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">New Password</label>
        <input type="password" name="new_password" required placeholder="••••••••"
               class="w-full text-xs rounded-xl px-4 py-2.5 bg-slate-900 border border-slate-800 text-slate-100 focus:outline-none focus:border-cyan-400">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Confirm New Password</label>
        <input type="password" name="confirm_password" required placeholder="••••••••"
               class="w-full text-xs rounded-xl px-4 py-2.5 bg-slate-900 border border-slate-800 text-slate-100 focus:outline-none focus:border-cyan-400">
      </div>

      <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-cyan-400 text-slate-950 hover:bg-cyan-300 transition">
        Update Password ➔
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="{% url 'login' %}" class="text-xs text-slate-400 hover:text-cyan-400 transition">
        ← Back to Sign In
      </a>
    </div>

  </div>
</div>
{% endblock %}
