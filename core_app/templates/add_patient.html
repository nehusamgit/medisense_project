{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-[#050913] text-white flex items-center justify-center p-6 font-sans">
  
  <div class="max-w-xl w-full bg-[#0a111e]/90 border border-slate-800/80 rounded-2xl p-8 shadow-2xl backdrop-blur-md relative">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800/80">
      <div>
        <h2 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>🩺</span> Assign Registered Patient
        </h2>
        <p class="text-xs text-slate-400 mt-1">Select an unassigned patient from database to add to your workspace</p>
      </div>
      <a href="{% url 'doctor_dashboard' %}" 
         class="px-3 py-1.5 rounded-xl border border-slate-700/60 text-slate-400 hover:text-white hover:bg-slate-800/50 text-xs font-semibold transition">
        ✕ Cancel
      </a>
    </div>

    <!-- FORM -->
    <form method="POST" action="{% url 'add_patient' %}" class="space-y-5">
      {% csrf_token %}

      <!-- PATIENT DROPDOWN -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Select Patient <span class="text-cyan-400">*</span>
        </label>
        <select name="patient_id" required
                class="w-full px-4 py-3 bg-[#050913] border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-400 transition cursor-pointer">
          <option value="" disabled selected>-- Choose a patient from database --</option>
          {% for p in unassigned_patients %}
            <option value="{{ p.id }}">
              {{ p.name }} (Age: {{ p.age }}{% if p.phone %}, Phone: {{ p.phone }}{% endif %})
            </option>
          {% empty %}
            <option value="" disabled>No unassigned patients found in database</option>
          {% endfor %}
        </select>
      </div>

      <!-- Primary Condition / Category -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Primary Condition / Clinical Category
        </label>
        <select name="condition" 
                class="w-full px-4 py-3 bg-[#050913] border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-400 transition cursor-pointer">
          <option value="general">General Checkup</option>
          <option value="hypertension">Hypertension (High BP)</option>
          <option value="diabetes">Diabetes / High Glucose</option>
          <option value="cardiac">Cardiac Concern</option>
          <option value="critical">Critical Care</option>
        </select>
      </div>

      <!-- SUBMIT BUTTON -->
      <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-800/80">
        <a href="{% url 'doctor_dashboard' %}" 
           class="px-5 py-2.5 rounded-xl border border-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-800/60 transition">
          Discard
        </a>
        <button type="submit" 
                class="px-6 py-2.5 rounded-xl bg-cyan-400 text-slate-950 text-xs font-bold hover:bg-cyan-300 transition shadow-lg shadow-cyan-500/20 flex items-center gap-2">
          <span>+</span> Assign to My Workspace
        </button>
      </div>

    </form>
  </div>

</div>
{% endblock %}
