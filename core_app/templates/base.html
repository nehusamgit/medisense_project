<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSense - AI Healthcare</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com="htmx.org@1.9.10"></script>
    <style>
  @keyframes breatheGlow {
    0%, 100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 4px #22d3ee; }
    50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 15px #22d3ee, 0 0 25px #22d3ee; }
  }
  .breathe-dot {
    animation: breatheGlow 2s ease-in-out infinite;
  }
  </style>
</head>

<body class="bg-[#060b13] text-white min-h-screen antialiased">

    <!-- GLOBAL NAVBAR -->
    <header class="max-w-6xl mx-auto flex items-center justify-between py-6 px-6 border-b border-slate-800">
        <!-- BRAND LOGO (Option 1: Pulse/ECG Logo) -->
        <!-- Google Fonts (Outfit & Plus Jakarta Sans) -->

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

<a href="/" class="flex items-center gap-3.5 group">
  <!-- Pulsing Icon -->
  <div class="relative flex items-center justify-center w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/30 shadow-[0_0_20px_rgba(6,182,212,0.2)]">
    <svg class="w-5 h-5 text-cyan-400 animate-pulse" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>
  </div>

  <div class="relative inline-block" style="font-family: 'Plus Jakarta Sans', sans-serif;">
    <span class="text-2xl font-extrabold tracking-tight">
      <span class="text-white">Medi</span><span class="text-cyan-400">Sense</span>
    </span>
    <!-- Breathing Dot -->
    <span class="absolute -top-1 -right-3 flex h-2.5 w-2.5">
      <span class="breathe-dot h-full w-full rounded-full bg-cyan-400"></span>
    </span>
  </div>
</a>
    </header>

    <!-- Page Content Slot -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
